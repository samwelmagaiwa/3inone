<div class="flex min-h-dvh">
  <!-- Sidebar: always there on a computer, a drawer on a phone -->
  <aside
    class="fixed inset-y-0 left-0 z-30 w-64 transform bg-brand-800 text-white transition-transform lg:static lg:translate-x-0"
    [class.-translate-x-full]="!open()"
  >
    <div class="px-6 py-5 text-lg font-extrabold">{{ appName }}</div>
    <nav class="flex flex-col gap-1 px-3">
      @for (item of nav; track item.label) {
        @if (item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-white/15"
            (click)="open.set(false)"
            class="rounded-lg px-3 py-2 font-semibold hover:bg-white/10"
            >{{ item.label }}</a
          >
        } @else {
          <span class="flex items-center justify-between rounded-lg px-3 py-2 text-white/40" title="Coming soon">
            {{ item.label }} <small class="text-[10px] uppercase tracking-wide">soon</small>
          </span>
        }
      }
    </nav>
  </aside>

  @if (open()) {
    <button class="fixed inset-0 z-20 bg-black/40 lg:hidden" aria-label="Close menu" (click)="open.set(false)"></button>
  }

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex items-center gap-3 border-b border-slate-200 bg-white px-4 py-3">
      <button class="rounded-lg border border-slate-300 px-3 py-1.5 lg:hidden" (click)="open.set(true)" aria-label="Open menu">☰</button>
      <div class="flex-1"></div>
      <div class="text-right leading-tight">
        <div class="text-sm font-bold">{{ auth.user()?.name }}</div>
        <div class="text-xs text-slate-500">{{ auth.user()?.role }}</div>
      </div>
      <button class="rounded-lg bg-slate-100 px-3 py-1.5 text-sm font-semibold hover:bg-slate-200" (click)="auth.logout()">
        Sign out
      </button>
    </header>

    <main class="flex-1 p-4 lg:p-8"><router-outlet /></main>
  </div>
</div>
