; Production error handling. A PHP warning or a deprecation notice must NEVER be written into the response: the app (and the web) read
; every answer as JSON, so one line of "<br /><b>Deprecated</b>..." in front of it makes the whole answer unreadable. Problems go to the log.
display_errors = Off
display_startup_errors = Off
html_errors = Off
log_errors = On
; Deprecation notices (a newer PHP warning about an old constant) are not errors the app can act on: keep them out of the log's noise too.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
