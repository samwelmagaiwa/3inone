# Redis for the app's cache, queue and rate limits, inside the app container (only the app talks to it, on localhost).
# Moving it to its own server later (for a second app server) is a change of REDIS_HOST, nothing else.
bind 127.0.0.1
port 6379
protected-mode yes
daemonize no

# Queued jobs must survive a restart or a deploy: an append-only file on the storage volume.
dir /var/www/html/storage/redis
appendonly yes
appendfsync everysec
save ""

# A ceiling, and what to drop when it is reached: only keys that expire (cache entries, rate-limit counters), never the queue.
maxmemory 512mb
maxmemory-policy volatile-lru

loglevel warning
logfile ""
