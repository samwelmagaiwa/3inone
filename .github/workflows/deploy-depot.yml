name: Build and push depot backend image

# NOTE: every job below is switched off in the samwelmagaiwa/3inone repository (see the `if:` lines). This file
# builds magaiwa/depot and DEPLOYS to the live VPS with `migrate --force`; a copy of the project in another
# repository must never be able to do that. The `if:` is false only for a repository named 3inone, so it changes
# nothing for the repository this pipeline was written for. 3inone has its own build-only workflow:
# build-3inone-backend.yml.

on:
  push:
    branches: [master]
    paths:
      - "backend_mapato/**"
      - ".github/workflows/deploy-depot.yml"
  workflow_dispatch: {}

jobs:
  # Gate: the image is only built and deployed if the backend test suite passes.
  # Same PHP minor as the production image (php:8.2-fpm-alpine); tests run on an
  # in-memory SQLite database (.env.testing / phpunit.xml), never a real one.
  test:
    if: ${{ !endsWith(github.repository, '/3inone') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_mapato
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, bcmath, intl, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run tests
        run: php artisan test

  build-and-push:
    needs: test
    if: ${{ !endsWith(github.repository, '/3inone') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        # Plain bash retry instead of a third-party retry action: avoids
        # depending on that action's own Node runtime (nick-fields/retry@v3
        # broke outright when GitHub Actions runners moved to Node 24 by
        # default -- the action itself never even got to run the build).
        run: |
          for attempt in 1 2 3; do
            if docker buildx build \
              --push \
              --provenance=false \
              --tag magaiwa/depot:latest \
              --tag magaiwa/depot:${{ github.sha }} \
              ./backend_mapato; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              echo "docker buildx build failed after 3 attempts"
              exit 1
            fi
            echo "build attempt $attempt failed, retrying in 15s..."
            sleep 15
          done

  deploy:
    needs: build-and-push
    if: ${{ !endsWith(github.repository, '/3inone') }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 169.58.188.122
          username: deploy
          key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /www/depot
            # Docker Hub occasionally 500s on a blob read mid-pull; retry
            # with backoff rather than failing the whole deploy on a blip.
            for attempt in 1 2 3 4 5; do
              if docker compose pull; then
                break
              fi
              if [ "$attempt" = "5" ]; then
                echo "docker compose pull failed after 5 attempts"
                exit 1
              fi
              echo "pull attempt $attempt failed, retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
            done
            docker compose up -d --remove-orphans
            sleep 3
            docker exec depot_backend php artisan migrate --force
            docker exec depot_backend php artisan config:cache
            docker exec depot_backend php artisan route:cache
            docker exec depot_backend php artisan view:clear
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 https://depot.magrethschools.sc.tz/api/health || echo 000)
            echo "Health check: HTTP $code"
            # Fail the run (not just print) when the new release does not answer.
            [ "$code" = "200" ] || { echo "Health check failed"; exit 1; }
            # Queued jobs and scheduled commands only run if these two processes are up.
            sleep 8
            docker exec depot_backend sh -c "ps -eo args | grep -q '[q]ueue:work' && ps -eo args | grep -q '[s]chedule:work'"               || { echo "Queue worker or scheduler is not running"; exit 1; }
            echo "Queue worker and scheduler are running"
