name: Build 3inone backend image

# Builds the backend image and pushes it to Docker Hub as magaiwa/3inone-backend.
#
# This workflow only BUILDS. It never touches a server: no SSH, no migrations. Putting an image on a
# server is a separate decision, made by whoever runs that server.
#
# It runs only in the samwelmagaiwa/3inone repository. Putting the image on the server is done by hand
# (see backend_mapato/docs/DEPLOY.md).
#
# Needs two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.

on:
  push:
    branches: [master]
    paths:
      - "backend_mapato/**"
      - ".github/workflows/build-3inone-backend.yml"
  workflow_dispatch: {}

jobs:
  # Gate: the image is only built if the backend test suite passes. Same PHP minor as the image
  # (php:8.2-fpm-alpine); tests run on an in-memory SQLite database (.env.testing / phpunit.xml),
  # never a real one.
  test:
    if: ${{ endsWith(github.repository, '/3inone') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_mapato
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, bcmath, intl, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run tests
        run: php artisan test

  build-and-push:
    needs: test
    if: ${{ endsWith(github.repository, '/3inone') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        # Plain bash retry instead of a third-party retry action: that action broke when the runners moved
        # to a newer Node, and never even got to the build.
        run: |
          for attempt in 1 2 3; do
            if docker buildx build \
              --push \
              --provenance=false \
              --tag magaiwa/3inone-backend:latest \
              --tag magaiwa/3inone-backend:${{ github.sha }} \
              ./backend_mapato; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              echo "docker buildx build failed after 3 attempts"
              exit 1
            fi
            echo "build attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
